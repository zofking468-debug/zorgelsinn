<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adres → Google Maps</title>
<style>
body{margin:0;padding:16px;background:#0b0d10;color:#eee;font:16px system-ui,sans-serif;max-width:600px;margin:auto}
button,a.b{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:16px;border:0;border-radius:14px;background:#22c55e;color:#04200d;font-size:17px;font-weight:700;text-align:center;text-decoration:none}
textarea{width:100%;box-sizing:border-box;height:220px;background:#161a20;color:#eee;border:1px solid #333;border-radius:12px;padding:10px;font:inherit}
#st{color:#8b95a5;min-height:22px}
</style>
</head>
<body>
<h2>📦 Ekran görüntüsünden Apple Maps rotası</h2>
<input type="file" id="f" accept="image/*" multiple hidden>
<button id="pick">🖼️ Ekran görüntüsü seç</button>
<div id="st"></div>
<textarea id="t" placeholder="Okunan adresler burada çıkar (her satır bir adres). Düzeltebilirsin."></textarea>
<div id="out"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
var SEHIR="Samsun"; /* adreste il yoksa sonuna eklenir; istemezsen "" yap */
var W="A-Za-z0-9ÇĞİÖŞÜçğıöşü";
var MAH="(?<!["+W+"])(?:mahalle(?:s[iİıI])?|mah\\.?|mh\\.?)(?!["+W+"])";
var STR="(sokak|sok\\.?|sk\\.?|cadde(?:s[iİıI])?|cad\\.?|cd\\.?|bulvar[ıİiI]?|blv\\.?)(?!["+W+"])";
var RE_MS=new RegExp(MAH+"\\s+((?:["+W+"]+\\s+){0,3}?["+W+"]+)\\s+"+STR+"(?:\\s+no\\s*[:.]?\\s*(\\d+[A-Za-z]?(?:\\/\\d+)?))?","ig");
var RE_M=new RegExp(MAH,"i");
var SEP=/(atand[ıiİI]|teslimat|par[çc]a\s*say|g[öo]rev\s*no|m[üu][şs]teri|al[ıi]c[ıi]|\badet|eksiksiz|takip|onayl[ıi]|\biade|\bdesi|a[ğg][ıi]rl[ıi]k|tamamlan|t[üu]m[üu]n[üu]|[çc][ıi]k[ıi][şs]|\barama)/i;
var ADDR=new RegExp("mahalle|(?:mah|mh|sokak|sok|sk|cadde|cad|cd|bulvar|blv|apt)\\.?(?!["+W+"])|apartman","i");

function tc(s){return s.toLocaleLowerCase("tr").replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toLocaleUpperCase("tr")})}
function key(s){return s.toLocaleLowerCase("tr").replace(/[^a-z0-9çğıöşü]/g,"")}

var KEEP=/^(no|mh|mah|sk|sok|cd|cad|blv|apt|pk)$/i;
function clean(text){
  return text.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü0-9\s.:\/-]/g," ")
    .split(/\s+/).filter(function(t){
      if(!/[A-Za-zÇĞİÖŞÜçğıöşü0-9]/.test(t))return false;          /* sadece işaret: *, ., - */
      var w=t.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,"");
      if(w.length&&w.length<=2&&!/\d/.test(t)&&!KEEP.test(w))return false; /* "Kü", "Ç" gibi çöp */
      return true;
    }).join(" ");
}
function fromCard(text){
  text=clean(text);
  var m=RE_M.exec(text);
  var best=null,x;
  RE_MS.lastIndex=0;
  while((x=RE_MS.exec(text))){ if(!best||(!best[3]&&x[3]))best=x; if(best[3])break; }
  if(m&&best){
    var before=text.slice(0,m.index).trim().split(/\s+/).filter(function(w){return /[A-Za-zÇĞİÖŞÜçğıöşü]/.test(w)&&!/[:]$/.test(w)}).slice(-3);
    if(before.length){
      var t=/^(sok|sk)/i.test(best[2])?"Sokak":/^(cad|cd)/i.test(best[2])?"Caddesi":"Bulvarı";
      var r=tc(before.join(" "))+" Mahallesi "+tc(best[1])+" "+t+(best[3]?" No "+best[3]:"");
      return r+(SEHIR&&!/samsun/i.test(r)?" "+SEHIR:"");
    }
  }
  /* yedek: sadece temizle */
  var c=text.replace(/\s*\b(kat|daire|d)\s*[:.]?\s*\d+.*$/i,"").replace(/\bPK\s*[:.]?\s*\d*/ig,"").replace(/\s+/g," ").trim();
  return c.length>=8?tc(c):"";
}

function parse(text){
  var lines=text.split(/\n/).map(function(l){return l.replace(/\s+/g," ").trim()});
  var cards=[],cur=[];
  lines.forEach(function(l){
    if(!l)return;
    if(SEP.test(l)){if(cur.length)cards.push(cur);cur=[];return}
    cur.push(l);
  });
  if(cur.length)cards.push(cur);
  var seen={},out=[];
  cards.forEach(function(c){
    var i=0;while(i<c.length&&!ADDR.test(c[i]))i++;   /* baştaki ad-soyad satırlarını at */
    if(i>=c.length)return;
    var a=fromCard(c.slice(i).join(" "));
    var k=key(a);
    if(a&&!seen[k]){seen[k]=1;out.push(a)}
  });
  return out;
}

function mapsUrls(addrs){
  var urls=[];
  for(var i=0;i<addrs.length;i+=10){
    var p=addrs.slice(i,i+10), dest=p[p.length-1], wp=p.slice(0,-1);
    var u="https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination="+encodeURIComponent(dest);
    if(wp.length) u+="&waypoints="+wp.map(encodeURIComponent).join("%7C");
    urls.push(u);
  }
  return urls;
}

var myPos=null;
function getPos(){return new Promise(function(res){
  if(myPos||!navigator.geolocation)return res(myPos);
  navigator.geolocation.getCurrentPosition(function(p){myPos=p.coords.latitude+","+p.coords.longitude;res(myPos)},function(){res(null)},{enableHighAccuracy:true,timeout:8000});
})}
var nextI=0;
function showButtons(){
  var addrs=document.getElementById("t").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
  var out=document.getElementById("out");out.textContent="";
  if(!addrs.length)return;
  if(nextI>=addrs.length)nextI=0;
  function ap(ad){return "https://maps.apple.com/?dirflg=d&daddr="+encodeURIComponent(ad)}
  /* Apple Maps: tek hedef destekler -> sıradaki durağı aç */
  var nb=document.createElement("button");
  nb.textContent="▶ Apple Maps: sıradaki durak ("+(nextI+1)+"/"+addrs.length+")";
  nb.onclick=function(){window.location.href=ap(addrs[nextI]);nextI++;showButtons()};
  out.appendChild(nb);
  /* Google Maps: tüm duraklar tek rota (10’arlık parçalar) */
  mapsUrls(addrs).forEach(function(u,i,arr){
    var g=document.createElement("a");g.className="b";g.target="_blank";g.href=u;
    g.style.background="#3b82f6";g.style.color="#fff";
    g.textContent="🚀 Google Maps: hepsini tek rota"+(arr.length>1?" ("+(i+1)+"/"+arr.length+")":"");
    out.appendChild(g);
  });
  addrs.forEach(function(ad,i){
    var box=document.createElement("div");box.style.cssText="background:#161a20;border-radius:14px;padding:10px;margin:10px 0";
    var h=document.createElement("div");h.textContent=(i+1)+". "+ad;h.style.cssText="font-weight:600;margin-bottom:8px";
    box.appendChild(h);
    var row=document.createElement("div");row.style.cssText="display:flex;gap:8px";
    var fr=null,nt=null;
    var sb=document.createElement("button");sb.textContent="📍 Konumu göster";sb.style.cssText="margin:0;flex:1";
    sb.onclick=async function(){
      if(fr){fr.remove();if(nt)nt.remove();fr=null;nt=null;sb.textContent="📍 Konumu göster";return}
      sb.textContent="Konum alınıyor…";
      var pos=await getPos();
      fr=document.createElement("iframe");
      fr.src=pos?"https://maps.google.com/maps?output=embed&hl=tr&saddr="+pos+"&daddr="+encodeURIComponent(ad)
               :"https://maps.google.com/maps?output=embed&z=18&hl=tr&q="+encodeURIComponent(ad);
      fr.style.cssText="width:100%;height:300px;border:0;border-radius:12px;margin-top:10px";
      box.appendChild(fr);
      if(!pos){nt=document.createElement("div");nt.style.cssText="color:#8b95a5;font-size:13px;margin-top:6px";nt.textContent="Konum izni verilmedi, kendi konumun gösterilemiyor.";box.appendChild(nt)}
      sb.textContent="✖ Kapat";
    };
    var a=document.createElement("a");a.className="b";a.target="_blank";a.href=ap(ad);a.textContent=" Apple Maps";
    a.style.cssText="margin:0;flex:1;background:#252b35;color:#eee";
    row.appendChild(sb);row.appendChild(a);box.appendChild(row);
    out.appendChild(box);
  });
}

function prep(file){
  return new Promise(function(res){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var sc=2200/Math.max(img.width,img.height); sc=Math.min(Math.max(sc,1),3);
      var c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      var x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      var d=x.getImageData(0,0,c.width,c.height),p=d.data,h=new Uint32Array(256),i,g;
      for(i=0;i<p.length;i+=4){g=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;p[i]=g;h[g]++}
      var n=p.length/4,lo=0,hi=255,a=0;
      for(i=0;i<256;i++){a+=h[i];if(a>n*.02){lo=i;break}}
      a=0;for(i=255;i>=0;i--){a+=h[i];if(a>n*.02){hi=i;break}}
      var k=255/Math.max(hi-lo,1);
      for(i=0;i<p.length;i+=4){g=Math.max(0,Math.min(255,(p[i]-lo)*k));p[i]=p[i+1]=p[i+2]=g}
      x.putImageData(d,0,0);c.toBlob(function(b){res(b||file)},"image/png");
    };
    img.onerror=function(){res(file)};
    img.src=u;
  });
}
document.getElementById("pick").onclick=function(){document.getElementById("f").click()};
document.getElementById("t").oninput=showButtons;
document.getElementById("f").onchange=async function(e){
  var st=document.getElementById("st"),t=document.getElementById("t"),all=[];
  for(var i=0;i<e.target.files.length;i++){
    st.textContent="Okunuyor "+(i+1)+"/"+e.target.files.length+" …";
    var r=await Tesseract.recognize(await prep(e.target.files[i]),"tur");
    all=all.concat(parse(r.data.text));
  }
  t.value=all.join("\n");
  st.textContent=all.length+" adres bulundu.";
  showButtons();
  e.target.value="";
};
</script>
</body>
</html>
